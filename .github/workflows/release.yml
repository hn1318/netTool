name: release

# 推送 `v*` 形式的 tag 时构建 Windows 安装包并创建 GitHub Release。
# tag 名必须与 tauri.conf.json 的 version 一致（见下面的校验步骤）。
#
# 构建耗时主要来自 release profile（LTO + codegen-units=1）编译数百个 crate。
# 两点让这部分不落在关键路径上：
#   1. `ci.yml` 在 master 上预热 rust-cache，tag 运行直接恢复。
#   2. Tauri 首次打包下载的 NSIS/WiX 工具链缓存如下。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v，例如 0.1.1）。留空则使用 tauri.conf.json 中的版本。"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # tag 与打包版本不一致时，应用内更新检查会推荐一个"新"版本但内容相同。
      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($config.version -ne $tag) {
            Write-Error "Tag ${{ github.ref_name }} does not match tauri.conf.json version $($config.version). Bump the version (tauri.conf.json / Cargo.toml / package.json) before tagging."
            exit 1
          }
          if ($package.version -ne $tag) {
            Write-Error "Tag ${{ github.ref_name }} does not match package.json version $($package.version)."
            exit 1
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # 恢复 ci.yml 在默认分支预热的缓存；`cache-on-failure` 让中途失败的
      # 构建也留下部分产物。
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      # Tauri 首次打包会下载 NSIS 和 WiX，这些几乎不变。
      - name: Cache Tauri bundler toolchain
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-tools-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            tauri-tools-${{ runner.os }}-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 无需单独 type-check：`pnpm build`（beforeBuildCommand）已包含
      # `vue-tsc --noEmit && vite build`，且会在 cargo 编译前失败。

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 用于签名更新包（可选）。未配置密钥时也能正常构建安装包，
          # 只是不产出签名好的自动更新产物。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # 手动运行时使用输入版本，否则回退到 tauri.conf.json 的版本。
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version || '0.0.0') }}
          releaseName: "NetTool ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}"
          releaseBody: |
            Windows 安装包见下方 Assets：
            - `.msi` —— Windows Installer 安装版
            - `-setup.exe` —— NSIS 安装程序

            Windows installers are attached below.
          # 手动运行默认创建草稿，避免误发布尚未核验的构建。
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          # 打包 NSIS + MSI 两种安装包；缺失时明确报错而不是静默跳过。
          args: --bundles nsis,msi
